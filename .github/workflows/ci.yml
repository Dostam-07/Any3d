name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  presentation:
    name: Presentation invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (cold cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # A warm browser cache still needs the OS libraries on a fresh runner.
      - name: Install Chromium system deps (warm cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The studio talks to its own API, so both halves run in the job.
      - name: Start API and app
        run: |
          node server/index.js > .tmp-api.log 2>&1 &
          npx vite --port 5174 --strictPort > .tmp-vite.log 2>&1 &
      # verify-showcase waits for both servers itself and fails on the invariants:
      # iframe survives a presentation switch, card CTA exports and copies, the
      # Editable source link opens the editor, pixel art fills its frame, and the
      # console stays clean.
      - name: Verify hero and card presentations
        run: npm run verify:showcase
        env:
          A3D_URL: http://localhost:5174
          A3D_API: http://localhost:3001
          A3D_TIMEOUT_MS: 120000

      # The documented pixel finish options (bayer / shadow / rim / wind /
      # contact) have no preset coverage, so probe them directly: the same scene
      # is bundled with and without them and the pixels must differ.
      - name: Verify documented pixel finish options
        if: always()
        run: npm run verify:pixel-finish

      # The SVG kernel header is the contract for every figure; call all of it,
      # with sane and with non-finite arguments, and inspect the markup.
      - name: Verify documented SVG toolkit
        if: always()
        run: npm run verify:svg-api

      # Same walk for the pixel kernel: every documented P call, rasterised and
      # inspected, with a second pass handed non-finite arguments.
      - name: Verify documented pixel toolkit
        if: always()
        run: npm run verify:pixel-api

      # Re-shoot every README still through the studio and compare it with the
      # committed one on a coarse luminance grid: a scene that still draws but
      # stopped looking like itself fails here.
      - name: Verify the committed stills still match
        if: always()
        run: npm run verify:fidelity
        env:
          A3D_URL: http://localhost:5174
          A3D_API: http://localhost:3001
      - name: Server logs
        if: failure()
        run: tail -n 80 .tmp-api.log .tmp-vite.log
